# Every dataset that is built (one dvc stage each). What uses which session:
# - continuous decoding: the sessions with kinematics (label_source measured / mirrored)
# - discrete decoding: the datasets of discrete_datasets (gesture.npy: shared gestures, src/femg/config/gestures.yaml)
# - pretraining: every session (label_source none: EMG only)
datasets: [emg_fk, ninapro_db2, ninapro_db8, ninapro_db7, great, ninapro_db5, ninapro_db3, ninapro_db4, fors_emg, grabmyo, emg_epn612, putemg, capgmyo_dba]
discrete_datasets: [ninapro_db2, ninapro_db8, ninapro_db7, great, ninapro_db5, ninapro_db3, ninapro_db4, fors_emg, grabmyo, emg_epn612, putemg, capgmyo_dba]  # must also be in datasets
percent: 100        # percentage of subjects per dataset
split:              # sessions.parquet `split` per subject: keep the test subjects out of pretraining and training
  test_percent: 20  # of each dataset's subjects (unless the dataset has an official split)
  seed: 0
sampling:           # data/processed/sampling.parquet: device group -> dataset -> subject -> session (src/femg/sampling.py)
  alpha: 0.5        # device groups and datasets drawn by (seconds)^alpha: 1 as the data, 0 all alike
workers: auto       # parallel subjects; auto = from CPUs and free RAM (~2 GB per worker)

processor:
  fs: 200
  label_fs: 100
  highpass: 3
  notch: true
  calib_s: 30
  rms_window_s: 0.1 # moving-RMS window (s) of the EMG anchors
  emg_anchors: [10, 95]  # percentiles of the moving RMS per channel: floor (~rest), active (~strong contraction)
  kin_anchors: [2, 98]   # percentiles per joint mapped to 0 (~open hand) and 1 (~closed hand)
  kin_lowpass: 6         # Hz, zero-phase on the labels: smooths glove quantization steps and camera jitter
  kin_max_repeat_s: 0.1  # a frame repeated up to this long is a late frame, interpolated over (longer = still hand)
  kin_max_gap_s: 0.1     # NaN gaps in the kinematics up to this long are interpolated, longer ones stay NaN
  settle_s: 0.2          # no label for the first 0.2 s of every segment (high-pass transient after a start or join)
