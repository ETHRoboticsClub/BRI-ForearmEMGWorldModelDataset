[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femg"
version = "0.1.0"
description = "Harmonized forearm EMG -> hand kinematics dataset for training a generic EMG2pose model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "h5py>=3.9",   # MATLAB v7.3 files
    "mne>=1.5",    # EMG-FK .fif files
    "kagglehub>=0.3",  # FORS-EMG (public Kaggle dataset, no credentials)
    "wfdb>=4.1",  # GRABMyo (PhysioNet WFDB records)
]

[project.optional-dependencies]
dvc = ["dvc[s3]>=3.50"]
viz = ["matplotlib>=3.7", "mujoco>=3.3", "mujoco-menagerie>=2026.10", "mjviser>=0.0.17", "typst>=0.15"]
explorer = ["femg[viz]", "fastapi>=0.110", "uvicorn[standard]>=0.29", "myo-sim>=0.2.3"]  # myo-sim: MyoHand  # python -m tools.explorer  # scripts/compare_datasets.py, scripts/view_hand.py
notebook = ["femg[viz]", "jupyterlab>=4", "ipykernel>=6"]  # notebooks/
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
femg = ["config/*.yaml", "hand/models/*.json", "datasets/config/*.yaml", "datasets/config/*.txt", "datasets/config/cues/*.yaml"]

[tool.ruff]
src = ["src", "scripts", "tools"]
line-length = 120
extend-exclude = ["tools/myogen"]  # its own repo, linted there

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-third-party = ["myogen"]  # tools/myogen is a submodule, installed as a package

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]  # imports after sys.path points at scripts/
