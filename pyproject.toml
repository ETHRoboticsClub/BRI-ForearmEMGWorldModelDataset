[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femg"
version = "0.1.0"
description = "Harmonized forearm EMG -> hand kinematics dataset for training a generic EMG2pose model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "h5py>=3.9",   # MATLAB v7.3 files
    "mne>=1.5",    # EMG-FK .fif files
]

[project.optional-dependencies]
dvc = ["dvc[s3]>=3.50"]
viz = ["matplotlib>=3.7", "mujoco>=3.3", "mujoco-menagerie>=2026.10", "mjviser>=0.0.17"]  # scripts/compare_datasets.py, scripts/view_hand.py
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "scripts"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
