description: 40 intact subjects, 49 instructed hand movements, raw CyberGlove II on the EMG hand.
citation: Atzori et al. 2014, Scientific Data 1:140053
license: see https://ninapro.hevs.ch (cite the paper)
url: https://ninapro.hevs.ch/instructions/DB2.html
device: "12 Delsys Trigno: 8 evenly spaced around the forearm at the radio-humeral joint + FDS, EDC, biceps, triceps"
hand: right

native_fs: 2000
effective_fs: 2000
mains_hz: 50
# labels: glove (the raw CyberGlove of the DB2 files, sign-flipped) or db9 (the calibrated angles of NinaPro DB9, same
# subjects; src/femg/datasets/ninapro_db9.py). can switch to db9 once scripts/tests/check_db9.py checked that every session lines up
kin_source: glove

electrodes:
  # The page puts the ring at the radio-humeral joint, just below the elbow (rotation and direction not documented),
  # and the 4 others on the main activity spots of FDS and EDC and on biceps and triceps
  - {name: ring, kind: bipolar, layout: ring, n: 8, z: 0.05, angle_sd: 180, z_sd: 0.05, mirror: true}
  - {name: fds, kind: bipolar, layout: spot, angle: 345, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: edc, kind: bipolar, layout: spot, angle: 180, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: biceps, kind: bipolar, layout: spot, angle: 0, z: -0.4, angle_sd: 30, z_sd: 0.15}
  - {name: triceps, kind: bipolar, layout: spot, angle: 180, z: -0.4, angle_sd: 30, z_sd: 0.15}
montages:
  ring8: 0-7

cues: ninapro_bcd  # E1 = exercise B, E2 = C, E3 = D (config/cues/ninapro_bcd.yaml)

notes:
  mat_variables: "DB2_s1 E1/E3 opened: emg (T,12) float32 V, glove (T,22), restimulus; E3 has no glove"
  glove_order: manufacturer order; not checked on DB2 data
  glove_signs: spreads and wrist_dev flipped (NINAPRO_FLIPPED), from the instructed E1 movements of S1, S2
