# NinaPro exercises A (1-12), B (13-29) and C (30-52), numbered across exercises as DB4/DB5 papers list the 52
# movements (Pizzolato et al. 2017, PLOS One 12:e0186132). The DB5 files number each exercise from 1: the reader
# adds the exercise's offset (ABC_CUE_OFFSETS in ninapro.py). B and C are exercises B and C of ninapro_bcd.yaml (same
# movements, ids + 12; tests/test_gestures.py checks they agree).
# native cue id: [name in the dataset, shared gesture in src/femg/config/gestures.yaml or null]
# Exercise A order checked on DB5 s1 E1 (glove, median vs rest): index, middle, ring, little alternate flexion (> 0) and
# extension (< 0), then thumb adduction / abduction (CMC abduction -16 / +12 deg); index flexion is weak (+3 deg).
1: [index finger flexion, index_flex]
2: [index finger extension, index_ext]
3: [middle finger flexion, middle_flex]
4: [middle finger extension, middle_ext]
5: [ring finger flexion, ring_flex]
6: [ring finger extension, ring_ext]
7: [little finger flexion, little_flex]
8: [little finger extension, little_ext]
9: [thumb adduction, thumb_add]
10: [thumb abduction, thumb_abd]
11: [thumb flexion, thumb_flex]
12: [thumb extension, thumb_ext]
13: [thumb up, thumb_up]
14: ["extension of index and middle, flexion of the others", index_middle_ext]
15: ["flexion of ring and little finger, extension of the others", ring_little_flex]
16: [thumb opposing base of little finger, thumb_opposition]
17: [abduction of all fingers, fingers_abduct]
18: [fingers flexed together in fist, fist]
19: [pointing index, point_index]
20: [adduction of extended fingers, fingers_adduct]
21: [wrist supination (axis middle finger), supination]
22: [wrist pronation (axis middle finger), pronation]
23: [wrist supination (axis little finger), supination_little]
24: [wrist pronation (axis little finger), pronation_little]
25: [wrist flexion, wrist_flex]
26: [wrist extension, wrist_ext]
27: [wrist radial deviation, radial_dev]
28: [wrist ulnar deviation, ulnar_dev]
29: [wrist extension with closed hand, wrist_ext_fist]
30: [large diameter grasp, large_diameter]
