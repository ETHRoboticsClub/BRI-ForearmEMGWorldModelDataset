description: 11 transradial amputees (10 used), DB2's 49 movements imagined with the amputated hand; cues only.
citation: Atzori et al. 2014, Scientific Data 1:140053
license: see https://ninapro.hevs.ch (cite the paper)
url: https://ninapro.hevs.ch/instructions/DB3.html
device: "12 Delsys Trigno: 8 evenly spaced around the forearm at the radio-humeral joint + FDS, EDC, biceps, triceps"
device_group: delsys_trigno  # the sampling group (params.yaml sampling; README: Sampling)
hand: right  # the amputated side; s02, s05, s06 left (NinaProDB3.LEFT, written per session)

native_fs: 2000
effective_fs: 2000
mains_hz: 50

electrodes:
  # As DB2 (the DB3 page describes the same placement). The stumps keep 0-90 % of the forearm (the DB3 page), so where
  # the forearm spots sit along it varies more than on intact arms: z_sd 0.2 on them
  - {name: ring, kind: bipolar, layout: ring, n: 8, z: 0.05, angle_sd: 180, z_sd: 0.05, mirror: true}
  - {name: fds, kind: bipolar, layout: spot, angle: 345, z: 0.3, angle_sd: 20, z_sd: 0.2}
  - {name: edc, kind: bipolar, layout: spot, angle: 180, z: 0.3, angle_sd: 20, z_sd: 0.2}
  - {name: biceps, kind: bipolar, layout: spot, angle: 0, z: -0.4, angle_sd: 30, z_sd: 0.15}
  - {name: triceps, kind: bipolar, layout: spot, angle: 180, z: -0.4, angle_sd: 30, z_sd: 0.15}
montages:
  ring8: 0-7

cues: ninapro_bcd  # E1 = exercise B, E2 = C, E3 = D, numbered across exercises as DB2

notes:
  mat_variables: >-
    s1, s2, s7 opened: emg (T,12) float V, glove (T,22) in E1/E2, restimulus E1 1-17, E2 18-40, E3 41-49, 6
    repetitions of every cue; s1 E2 holds only 18-29 (the page: "up to 49 movements")
  glove: >-
    not read: the subjects imagine the movement with the amputated hand, so the glove measures no hand of the EMG
    side (s1 E2: 13 of 22 sensors flat)
  emg_activity: >-
    E1, median 0.1 s RMS during cues / at rest per channel: s2 1.2-13, s1 0.9-1.6 (weak but there), s7 1.00-1.03
  s07: >-
    excluded: 0 % of the forearm left (the page), all channels ~2 uV with no difference between cues and rest, the FDS
    and EDC spots flat (std 0). The reader refuses any session with a flat channel
