description: 11 transradial amputees, cue labels only (the glove columns exist but barely move).
citation: Atzori et al. 2014, Scientific Data 1:140053
license: see https://ninapro.hevs.ch (cite the paper)
url: https://ninapro.hevs.ch/instructions/DB3.html
device: "12 Delsys Trigno: 8 evenly spaced around the forearm at the radio-humeral joint + FDS, EDC, biceps, triceps"
hand: right

native_fs: 2000
effective_fs: 2000
mains_hz: 50

electrodes:  # as DB2
  - {name: ring, kind: bipolar, layout: ring, n: 8, z: 0.05, angle_sd: 180, z_sd: 0.05, mirror: true}
  - {name: fds, kind: bipolar, layout: spot, angle: 345, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: edc, kind: bipolar, layout: spot, angle: 180, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: biceps, kind: bipolar, layout: spot, angle: 0, z: -0.4, angle_sd: 30, z_sd: 0.15}
  - {name: triceps, kind: bipolar, layout: spot, angle: 180, z: -0.4, angle_sd: 30, z_sd: 0.15}
montages:
  ring8: 0-7  # page: columns 1-8 are the ring

notes:
  zip_members: "s1_0.zip, s11_0.zip listed: DB3_s{i}/S{i}_E{1,2,3}_A1.mat (+ __MACOSX entries, ignored)"
  mat_variables: "S1_E1/E3 opened: emg (T,12) float32 V (rest RMS 2-5 uV), restimulus; glove (T,22) in E1/E2"
  glove: "S1: E2 glove std 0.05 raw units and identical across movements, E1 barely moves -> not used"
  channels: "page says 'up to 12' electrodes: some subjects may have flat channels (QC)"
