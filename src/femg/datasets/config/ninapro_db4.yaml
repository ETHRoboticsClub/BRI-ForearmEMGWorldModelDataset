description: 10 intact subjects, 52 instructed hand movements, 12 Cometa electrodes; cues only (no glove in the files).
citation: Pizzolato et al. 2017, PLOS One 12:e0186132
license: CC BY-ND 4.0 (the DB4 page)
url: https://ninapro.hevs.ch/instructions/DB4.html
device: "12 Cometa electrodes: 8 evenly spaced around the forearm at the radio-humeral joint + FDS, EDC, biceps, triceps"
device_group: cometa  # the sampling group (params.yaml sampling; README: Sampling)
hand: right

native_fs: 2000
effective_fs: 2000
mains_hz: 50
emg_unit_scale: 1.0  # NOT volts: units not documented. s1 E2 rest RMS 50-200 against 3-14 uV on DB2, cue / rest
# 2-15 as DB2: a signal, scaled unknown. Every step after reading divides each channel by its own active level

electrodes:
  # The DB4 page: "Columns 1-8 are the electrodes equally spaced around the forearm at the height of the radio humeral
  # joint. Columns 9 and 10 ... flexor and extensor digitorum superficialis ... 11 and 12 ... biceps and triceps": DB2's
  - {name: ring, kind: bipolar, layout: ring, n: 8, z: 0.05, angle_sd: 180, z_sd: 0.05, mirror: true}
  - {name: fds, kind: bipolar, layout: spot, angle: 345, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: edc, kind: bipolar, layout: spot, angle: 180, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: biceps, kind: bipolar, layout: spot, angle: 0, z: -0.4, angle_sd: 30, z_sd: 0.15}
  - {name: triceps, kind: bipolar, layout: spot, angle: 180, z: -0.4, angle_sd: 30, z_sd: 0.15}
montages:
  ring8: 0-7

cues: ninapro_abc  # E1 = exercise A (1-12), E2 = B (13-29), E3 = C (30-52), after ABC_CUE_OFFSETS (ninapro.py)

notes:
  mat_variables: >-
    s1 opened: emg (T,12), stimulus, restimulus, repetition, rerepetition, frequency 2000; no glove although the page
    lists one; restimulus 1-12 / 1-17 / 1-23 (each exercise from 1), 6 repetitions of every cue
  kinematics: none in the files, so DB4 serves discrete decoding and pretraining only
