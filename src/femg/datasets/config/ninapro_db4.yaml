description: 10 intact subjects, cue labels only (the page lists a glove, but the files have none).
citation: Pizzolato et al. 2017, PLoS ONE 12(10):e0186132
license: see https://ninapro.hevs.ch (cite the paper)
url: https://ninapro.hevs.ch/instructions/DB4.html
device: "12 Cometa: 8 evenly spaced around the forearm at the radio-humeral joint + FDS, EDC, biceps, triceps"
hand: right

native_fs: 2000
effective_fs: 2000
mains_hz: 50
emg_unit_scale: 1.0e-6  # assumed microvolts: S1 rest RMS 60-250, movement 200-1700 (not documented)

electrodes:  # as DB2
  - {name: ring, kind: bipolar, layout: ring, n: 8, z: 0.05, angle_sd: 180, z_sd: 0.05, mirror: true}
  - {name: fds, kind: bipolar, layout: spot, angle: 345, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: edc, kind: bipolar, layout: spot, angle: 180, z: 0.3, angle_sd: 20, z_sd: 0.1}
  - {name: biceps, kind: bipolar, layout: spot, angle: 0, z: -0.4, angle_sd: 30, z_sd: 0.15}
  - {name: triceps, kind: bipolar, layout: spot, angle: 180, z: -0.4, angle_sd: 30, z_sd: 0.15}
montages:
  ring8: 0-7  # page: columns 1-8 are the ring

notes:
  zip_members: "s1.zip, s10.zip listed: s{i}/S{i}_E{1,2,3}_A1.mat"
  mat_variables: "S1 E1-E3 opened: emg (T,12) float32, restimulus, frequency=2000, sensor='Cometa'; NO glove"
  emg_unit: assumed uV from amplitude; rest RMS 60-250 uV is high, to confirm
  exercise_variable: >-
    the 'exercise' variable of E1/E2 files is swapped (2/1); the file names match the movement counts of the page
    (12/17/23), so the file names are used
