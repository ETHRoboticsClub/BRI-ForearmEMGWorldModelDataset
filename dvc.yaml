# data/raw -> data/interim/<dataset> (common format) -> data/processed/<dataset> (training) -> data/processed/calibration,
# pushed to S3 with `dvc push`. Raw data is not tracked (it can be downloaded again): run scripts/pull_data.py first.
stages:
  interim:
    foreach: ${datasets}
    do:
      cmd: python scripts/build_dataset.py --dataset ${item} --stage interim --overwrite
      deps:
        - src/femg
        - scripts/build_dataset.py
      params:
        - percent
        - processor
      outs:
        - data/interim/${item}
  processed:
    foreach: ${datasets}
    do:
      cmd: python scripts/build_dataset.py --dataset ${item} --stage processed --overwrite
      deps:
        - src/femg
        - scripts/build_dataset.py
        - data/interim/${item}
      params:
        - percent
        - processor
        - split
      outs:
        - data/processed/${item}
  calibration:  # the calibration baseline over every dataset
    cmd: python scripts/build_dataset.py --stage calibration
    deps:
      - src/femg
      - scripts/build_dataset.py
      - data/processed/emg_fk  # one line per entry of datasets in params.yaml
      - data/processed/ninapro_db2
      - data/processed/ninapro_db8
      - data/processed/ninapro_db7
      - data/processed/great
      - data/processed/ninapro_db5
      - data/processed/ninapro_db3
      - data/processed/ninapro_db4
      - data/processed/fors_emg
      - data/processed/grabmyo
      - data/processed/emg_epn612
      - data/processed/putemg
      - data/processed/capgmyo_dba
    params:
      - datasets
    outs:
      - data/processed/calibration
