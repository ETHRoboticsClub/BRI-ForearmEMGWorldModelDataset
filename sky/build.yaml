# Builds the full dataset on a CPU machine next to the S3 bucket and pushes it with DVC.
#
#   sky launch -c femg-build sky/build.yaml --env SMOKE_TEST=1   # first time: create the machine, check S3
#   sky exec femg-build sky/build.yaml                           # sync code, dvc pull -> repro -> push
#   sky/fetch.sh                                                 # bring dvc.lock back, then commit it
#
# Building is CPU and download bound (no GPU). Raw downloads are cached on the machine's disk between runs
# (autostop keeps the disk), so re-builds after a code change only redo the processing.

name: femg-build

resources:
  infra: aws/us-east-1       # same region as the hri-control bucket
  cpus: 32+
  memory: 64+                # auto workers = min(cpus - 1, free RAM / 2 GB)
  disk_size: 512             # raw cache of every dataset (NinaPro DB8 alone is ~27 GB)
  autostop: 30

workdir: .

file_mounts:
  ~/.aws/credentials: ~/.aws/credentials   # the `hri` profile used by .dvc/config

envs:
  SMOKE_TEST: 0
  FRACTION: ""               # e.g. --env FRACTION=0.2 for a partial build into data/dev (not pushed)

setup: |
  set -e
  pip install -e ".[dvc]"

run: |
  set -e
  if [ ! -d .git ]; then
    git init -q && git add -A && git -c user.name=sky -c user.email=sky@localhost commit -qm sky
  fi
  if [ "$SMOKE_TEST" = "1" ]; then
    nproc && free -g
    dvc status --cloud
    exit 0
  fi
  mkdir -p ~/femg-raw data && ln -sfn ~/femg-raw data/raw   # downloads live outside the synced workdir
  if [ -n "$FRACTION" ]; then
    python -m femg.build --fraction "$FRACTION" --out data/dev
    exit 0
  fi
  dvc pull --allow-missing
  dvc repro
  dvc push
